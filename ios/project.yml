# XcodeGen project definition. The .xcodeproj is generated in CI (no Mac needed locally).
name: Mekan
options:
  bundleIdPrefix: app.mekan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MekanCore:
    path: MekanCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Mekan:
    type: application
    platform: iOS
    sources:
      - path: Mekan
    dependencies:
      - package: MekanCore
      - sdk: RoomPlan.framework
      - sdk: ARKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mekan.capture
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Mekan/Info.plist
      properties:
        CFBundleDisplayName: Mekan
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arkit
        NSCameraUsageDescription: Odanı LiDAR ile taramak için kameraya erişim gerekiyor.
        ITSAppUsesNonExemptEncryption: false
