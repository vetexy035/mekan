name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || xcodebuild -version

      - name: Test MekanCore
        run: swift test --package-path ios/MekanCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild build -quiet \
            -project Mekan.xcodeproj \
            -scheme Mekan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Mekan.app Payload/
          zip -qry Mekan.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Mekan-ipa
          path: ios/Mekan.ipa
          retention-days: 14
